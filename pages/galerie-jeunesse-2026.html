<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#127484" />
    <meta name="apple-mobile-web-app-status-bar" content="#197a86" />
    <meta
      name="description"
      content="Galerie photos et vidéos de la rencontre jeunesse édition 2026."
    />
    <link rel="apple-touch-icon" href="../icons/icon-192x192.png" />
    <link rel="icon" type="image/x-icon" href="../icons/icon.ico" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../fontawesome-free-6.7.2-web/css/all.css" />
    <title>Rencontre Jeunesse 2026 – Qadash TV</title>
  </head>
  <body>
    <qadash-site-header data-variant="compact"></qadash-site-header>

    <main class="gallery">
      <div class="gallery-header">
        <h1>
          <span lang-fr>Rencontre Jeunesse - Édition 2026</span
          ><span lang-en>Youth Gathering - 2026 Edition</span>
        </h1>
      </div>
      <hr />
      <section class="gallery-grid" id="gallery-grid"></section>
    </main>

    <qadash-site-footer></qadash-site-footer>

    <script>
      (function () {
        document.addEventListener("DOMContentLoaded", () => {
          const gallery = document.getElementById("gallery-grid");
          const folder = "../images/jeunesse2026";

          if (!gallery) return;

          function resolveSrc(s) {
            if (!s) return "";
            if (/^https?:\/\//i.test(s) || s.startsWith("/")) return s;
            return `${folder}/${s}`;
          }

          function showSkeletonGallery() {
            gallery.innerHTML = Array.from(
              { length: 8 },
              () => `
              <div class="skeleton-card skeleton-gallery-item" aria-label="Chargement de la galerie">
                <div class="skeleton-block skeleton-gallery-thumb"></div>
              </div>
            `,
            ).join("");
          }

          async function buildGallery() {
            showSkeletonGallery();

            try {
              const res = await fetch(`${folder}/index.json`);
              if (!res.ok) throw new Error("index not found");
              const list = await res.json();
              if (!Array.isArray(list) || list.length === 0) {
                gallery.innerHTML =
                  "<p>Aucun média défini dans index.json.</p>";
                return;
              }

              gallery.innerHTML = "";
              list.forEach((item) => {
                let src, type, alt;
                if (typeof item === "string") src = resolveSrc(item);
                else if (item && typeof item === "object") {
                  src = resolveSrc(item.src || item.path || "");
                  type = item.type;
                  alt = item.alt || "";
                }
                if (!src) return;
                if (!type) {
                  const ext = (src.split(".").pop() || "").toLowerCase();
                  type = ["mp4", "webm", "ogg", "mov"].includes(ext)
                    ? "video"
                    : "image";
                }

                const wrap = document.createElement("div");
                wrap.className = "thumb-wrap";
                const el = document.createElement("img");
                // use a custom thumbnail when provided in index.json
                let thumbSrc =
                  item && item.thumb ? resolveSrc(item.thumb) : null;
                if (type === "video" && !thumbSrc) {
                  thumbSrc = "https://placehold.co/600x400?text=video";
                } else if (type === "external-image" && !thumbSrc) {
                  thumbSrc = "https://placehold.co/300x400?text=image";
                } else if (type === "image" && !thumbSrc) {
                  thumbSrc = src;
                }
                el.src = thumbSrc;
                el.alt = alt || src;
                el.dataset.type = type;
                el.dataset.src = src;
                wrap.appendChild(el);
                if (type === "video") {
                  const overlay = document.createElement("div");
                  overlay.className = "video-overlay";
                  overlay.innerHTML =
                    '<div class="play"><i class="fa fa-play-circle"></i></div>';
                  wrap.appendChild(overlay);
                }
                gallery.appendChild(wrap);
              });
            } catch (err) {
              gallery.innerHTML = "<p>Impossible de charger index.json.</p>";
            }
          }

          buildGallery();
        });
      })();
    </script>
    <script defer src="../main.js"></script>
  </body>
</html>
