<!doctype html>
<html lang="fr">
  <head>
    <!-- Lien vers le manifest PWA-->
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#127484" />

    <meta
      name="description"
      content="Ce site a pour seul but de promouvoir la parole véritable de YEHOSHOUA (Jesus)."
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-status-bar" content="#197a86" />
    <link rel="apple-touch-icon" href="../icons/icon-192x192.png" />

    <!-- Lien vers la feuille de style principale -->
    <link rel="stylesheet" href="../styles.css" />

    <!-- font awesome file link  -->
    <link rel="stylesheet" href="../fontawesome-free-6.7.2-web/css/all.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../icons/icon.ico" />

    <title>Qadash TV - Livres</title>
  </head>
  <body>
    <qadash-site-header></qadash-site-header>

    <main class="livres">
      <section>
        <div class="section-header">
          <h1>
            <span lang-fr>Tous les livres</span><span lang-en>All books</span>
          </h1>

          <div class="filters">
            <i class="fa-solid fa-magnifying-glass"></i
            ><input
              type="text"
              id="bookSearch"
              placeholder="Nom de livre ou auteur..."
            />

            <select id="authorFilter">
              <option value="">Tous les auteurs</option>
            </select>

            <select id="langFilter">
              <option value="">Toutes les langues</option>
            </select>
          </div>
        </div>

        <h2><span lang-fr>Recommandé</span><span lang-en>Recommended</span></h2>

        <div class="book1">
          <div class="book">
            <img src="../images/bym.jpg" alt="Bible de Yéhoshoua ha Mashiah" />
            <h3>Bible de Yéhoshoua ha Mashiah (BYM)</h3>
            <p>
              <span lang-fr>Auteur : Shora KUETU</span
              ><span lang-en>Author: Shora KUETU</span>
            </p>
            <p style="color: #127484">
              <span lang-fr>Langue : Français</span
              ><span lang-en>Language: French</span>
            </p>
            <a
              class="btn"
              href="https://www.bibledejesuschrist.org/lire.html"
              target="_blank"
              ><span lang-fr>Lire en ligne</span
              ><span lang-en>Read online</span></a
            >
          </div>
        </div>

        <h2>
          <span lang-fr>Derniers ajouts</span
          ><span lang-en>Latest additions</span>
        </h2>

        <div class="book-list"></div>

        <div class="pagination">
          <button id="prevPage" class="btn">
            <span lang-fr>Précédent</span><span lang-en>Previous</span>
          </button>
          <span id="pageInfo"
            ><span lang-fr>Page 1</span><span lang-en>Page 1</span></span
          >
          <button id="nextPage" class="btn">
            <span lang-fr>Suivant</span><span lang-en>Next</span>
          </button>
        </div>
      </section>
    </main>

    <qadash-site-footer></qadash-site-footer>

    <script defer src="../main.js"></script>
    <script defer src="../scripts/app.js"></script>
    <script defer src="../scripts/livres.js"></script>
  </body>
</html>
