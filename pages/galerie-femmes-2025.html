<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../fontawesome-free-6.7.2-web/css/all.css" />
    <title>Rencontre des Femmes 2025 – Qadash TV</title>
  </head>
  <body>
    <header class="nav-bar">
      <div class="logo">
        <a href="../"
          ><img src="../images/logo_qadash.jpg" alt="Qadash TV" height="70"
        /></a>
        <a href="../pages/rencontre-femmes.html" class="back-link"
          ><i class="fa fa-chevron-left"></i
        ></a>
      </div>
    </header>

    <main class="gallery">
      <div class="gallery-header">
        <h1>Rencontre des Femmes – Édition 2025</h1>
      </div>
      <hr />
      <section class="gallery-grid" id="gallery-grid"></section>
    </main>

    <footer>
      <p>&copy; Qadash tv 2025 - Tout droits réservés</p>
      <p>
        <!-- Suivez-nous : -->
        <a
          href="https://web.facebook.com/profile.php?id=61557829689735&mibextid=ZbWKwL&_rdc=1&_rdr#"
          target="_blank"
          ><i class="fab fa-facebook-f"></i
        ></a>
        <a href="https://www.instagram.com/qadash_tv_officiel/" target="_blank"
          ><i class="fab fa-instagram"></i
        ></a>
        <a href="https://www.youtube.com/@Qadash-TV" target="_blank"
          ><i class="fab fa-youtube"></i
        ></a>
        <a
          href="https://www.whatsapp.com/channel/0029VaDmKpv8aKvDNdPlTP1R"
          target="_blank"
          ><i class="fab fa-whatsapp"></i
        ></a>
      </p>
    </footer>

    <script>
      (function () {
        document.addEventListener("DOMContentLoaded", () => {
          const gallery = document.getElementById("gallery-grid");
          const folder = "../images/femmes2025";

          if (!gallery) return;

          function resolveSrc(s) {
            if (!s) return "";
            if (/^https?:\/\//i.test(s) || s.startsWith("/")) return s;
            return `${folder}/${s}`;
          }

          async function buildGallery() {
            try {
              const res = await fetch(`${folder}/index.json`);
              if (!res.ok) throw new Error("index not found");
              const list = await res.json();
              if (!Array.isArray(list) || list.length === 0) {
                gallery.innerHTML =
                  "<p>Aucun média défini dans index.json.</p>";
                return;
              }

              gallery.innerHTML = "";
              list.forEach((item) => {
                let src, type, alt;
                if (typeof item === "string") src = resolveSrc(item);
                else if (item && typeof item === "object") {
                  src = resolveSrc(item.src || item.path || "");
                  type = item.type;
                  alt = item.alt || "";
                }
                if (!src) return;
                if (!type) {
                  const ext = (src.split(".").pop() || "").toLowerCase();
                  type = ["mp4", "webm", "ogg", "mov"].includes(ext)
                    ? "video"
                    : "image";
                }

                const wrap = document.createElement("div");
                wrap.className = "thumb-wrap";
                const el = document.createElement("img");
                // use a custom thumbnail when provided in index.json
                let thumbSrc = (item && item.thumb) ? resolveSrc(item.thumb) : null;
                if (type === "video" && !thumbSrc) {
                  thumbSrc = "https://placehold.co/600x400?text=video";
                } 
                else if (type === "external-image" && !thumbSrc) {
                  thumbSrc = "https://placehold.co/300x400?text=image";
                }
                else if (type === "image" && !thumbSrc) {
                  thumbSrc = src;
                }
                el.src = thumbSrc;
                el.alt = alt || src;
                el.dataset.type = type;
                el.dataset.src = src;
                wrap.appendChild(el);
                if (type === "video") {
                  const overlay = document.createElement("div");
                  overlay.className = "video-overlay";
                  overlay.innerHTML = '<div class="play"><i class="fa fa-play-circle"></i></div>';
                  wrap.appendChild(overlay);
                }
                gallery.appendChild(wrap);
              });
            } catch (err) {
              gallery.innerHTML = "<p>Impossible de charger index.json.</p>";
            }
          }

          gallery.addEventListener("click", (e) => {
            const img = e.target.closest("img");
            if (!img) return;
            const src = img.dataset.src || img.src;
            try {
              const w = window.open(src, "_parent");
              if (w) w.opener = null;
            } catch (err) {
              const a = document.createElement("a");
              a.href = src;
              a.target = "_parent";
              a.rel = "noopener noreferrer";
              document.body.appendChild(a);
              a.click();
              a.remove();
            }
          });

          buildGallery();
        });
      })();
    </script>
  </body>
</html>
