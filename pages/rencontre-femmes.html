<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#127484" />
    <meta name="apple-mobile-web-app-status-bar" content="#197a86" />
    <meta
      name="description"
      content="Découvrez les éditions des rencontres des femmes organisées par Qadash TV."
    />
    <link rel="apple-touch-icon" href="../icons/icon-192x192.png" />
    <link rel="icon" type="image/x-icon" href="../icons/icon.ico" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../fontawesome-free-6.7.2-web/css/all.css" />
    <title>Rencontre des Femmes – Qadash TV</title>
  </head>
  <body>
    <qadash-site-header data-variant="compact"></qadash-site-header>

    <main class="albums">
      <div class="gallery-header">
        <h1>
          <span lang-fr>Programmes des femmes</span
          ><span lang-en>Women's programs</span>
        </h1>
      </div>
      <hr />
      <section class="album-grid">
        <div class="album-card">
          <img src="../images/femmes2025-cover.jpeg" alt="2025 edition" />
          <h3>
            <span lang-fr>2e édition - Douala 2025</span
            ><span lang-en>2nd edition - Douala 2025</span>
          </h3>
          <a href="../pages/galerie-femmes-2025.html" class="btn"
            ><span lang-fr>Voir la galerie</span
            ><span lang-en>View gallery</span></a
          >
        </div>

        <div class="album-card">
          <img src="../images/femmes2024-cover.jpg" alt="2024 edition" />
          <h3>
            <span lang-fr>1re édition - Akonolinga 2024</span
            ><span lang-en>1st edition - Akonolinga 2024</span>
          </h3>
          <a href="../pages/galerie-femmes-2024.html" class="btn"
            ><span lang-fr>Voir la galerie</span
            ><span lang-en>View gallery</span></a
          >
        </div>
      </section>
    </main>

    <qadash-site-footer></qadash-site-footer>
    <script defer src="../main.js"></script>
  </body>
</html>
